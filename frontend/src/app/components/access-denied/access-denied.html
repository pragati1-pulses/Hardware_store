<div class="min-h-[calc(100vh-80px)] w-full flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 px-4 py-8">

  <div class="w-full max-w-lg bg-white rounded-3xl border border-slate-100 shadow-2xl p-8 sm:p-12 text-center relative overflow-hidden">
    
    <!-- Decorative background glow -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-rose-500/5 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Security Icon -->
    <div class="flex justify-center mb-7 relative">
      <div class="absolute inset-0 bg-rose-500/10 rounded-full blur-xl transform scale-125"></div>
      <div class="relative w-20 h-20 rounded-2xl bg-rose-50 border border-rose-100 flex items-center justify-center shadow-inner">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-10 h-10 text-rose-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.75">

          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z" />

          <rect x="9" y="10" width="6" height="5" rx="1" />
          <path d="M10 10V8a2 2 0 0 1 4 0v2" />

        </svg>
      </div>
    </div>

    <!-- Status Label -->
    <span class="inline-flex items-center gap-1.5 px-3.5 py-1.5 mb-5 rounded-full bg-rose-50 border border-rose-100 text-rose-600 text-xs font-semibold tracking-wider uppercase shadow-sm">
      <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
      Restricted Access
    </span>

    <!-- Heading -->
    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight mb-3">
      Access Restricted
    </h1>

    <!-- Description -->
    <p class="text-sm sm:text-base text-slate-500 leading-relaxed mb-8">
      You currently don't have permission to access this page.
      Please contact your Store Owner or Administrator if you
      believe you should have access.
    </p>

    <!-- Divider -->
    <div class="border-t border-slate-100 mb-7"></div>

    <!-- Dashboard Button -->
    <button
      type="button"
      (click)="goToDashboard()"
      class="w-full flex items-center justify-center gap-2.5 bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-white font-medium text-sm py-4 px-6 rounded-xl shadow-lg shadow-slate-900/10 hover:shadow-slate-900/20 transition-all duration-200">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-4 h-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2">

        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 19l-7-7 7-7M8 12h13" />

      </svg>

      Return to Dashboard

    </button>

    <!-- Footer Text -->
    <p class="text-xs text-slate-400 mt-6">
      Need assistance? Contact your administrator.
    </p>

  </div>

</div>
