<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 p-4">
  <div class="bg-white rounded-3xl shadow-2xl flex flex-col md:flex-row w-full max-w-4xl overflow-hidden border border-slate-100">
    
    <!-- Left Side (Branding) -->
    <div class="md:w-1/2 bg-slate-900 p-10 flex flex-col justify-between text-white relative overflow-hidden">
      <!-- Decorative background glow effect -->
      <div class="absolute -right-20 -bottom-20 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <!-- Top: Logo / Badge -->
      <div>
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-400 mb-6 shadow-inner">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
          </svg>
        </div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white mb-1">BUILD<span class="text-amber-500">MART</span></h1>
        <p class="text-slate-400 text-sm font-medium tracking-wide uppercase">Hardware Store Management</p>
      </div>

      <!-- Center/Bottom: Quote & Feature highlights -->
      <div class="my-12 relative z-10">
        <p class="text-slate-300 italic text-base leading-relaxed">"Manage your inventory, billing, and store operations efficiently, anywhere."</p>
      </div>

      <div class="text-xs text-slate-500 border-t border-slate-800 pt-4 flex justify-between items-center">
        <span>Secure Portal v2.4</span>
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Systems Online</span>
      </div>
    </div>

    <!-- Right Side (Form) -->
    <div class="md:w-1/2 p-10 md:p-12 flex flex-col justify-center bg-white">
      <div class="mb-8">
        <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome Back</h2>
        <p class="text-sm text-slate-500 mt-1">Please enter your credentials to access your dashboard.</p>
      </div>
      
      @if (errorMessage) {
        <div class="bg-rose-50 border border-rose-200 text-rose-600 p-3.5 rounded-xl mb-6 text-sm font-medium flex items-center gap-2 animate-shake">
          <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
          <span>{{ errorMessage }}</span>
        </div>
      }

      <form (ngSubmit)="onLogin()" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
            </span>
            <input type="email" [(ngModel)]="loginData.email" name="email" required placeholder="name@buildmart.com"
                   class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:bg-white focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1.5">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600">Password</label>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </span>
            <input type="password" [(ngModel)]="loginData.password" name="password" required placeholder="••••••••"
                   class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:bg-white focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
          </div> 
          
        </div>
        
   <div class="flex justify-end -mt-2 mb-4">
            <a routerLink="/forgot-password" class="text-sm font-medium text-amber-600 hover:text-amber-700 hover:underline transition-colors">Forgot Password?</a>
        </div>

        <button type="submit" [disabled]="isLoading"
                class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3.5 px-4 rounded-xl mt-2 shadow-lg shadow-slate-900/10 hover:shadow-slate-900/20 active:scale-[0.99] transition-all disabled:opacity-50 flex items-center justify-center gap-2">
          @if (isLoading) {
            <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <span>Signing in...</span>
          } @else {
            <span>Sign In to Dashboard</span>
          }
        </button>
      </form>
    </div>

  </div>
</div>
