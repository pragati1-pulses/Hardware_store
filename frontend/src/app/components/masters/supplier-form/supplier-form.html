<div class="p-6 md:p-10 max-w-4xl mx-auto w-full">
  
  <!-- Header with Back Button -->
  <div class="flex items-center mb-8">
    <button (click)="cancel()" class="mr-4 p-2.5 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 hover:text-blue-600 transition-all shadow-sm group">
      <svg class="w-5 h-5 text-gray-500 group-hover:text-blue-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    </button>
    <div>
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">{{ editingId ? 'Edit Supplier' : 'Add New Supplier' }}</h1>
      <p class="text-gray-500 text-sm mt-1">Fill in the details below to {{ editingId ? 'update the' : 'create a new' }} supplier profile.</p>
    </div>
  </div>

  <!-- Error/Success Message -->
  @if (message) {
    <div class="px-4 py-3 rounded-xl mb-6 shadow-sm border flex items-center"
         [ngClass]="isError ? 'bg-red-50 border-red-200 text-red-700' : 'bg-green-50 border-green-200 text-green-700'">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        @if (isError) {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        }
      </svg>
      {{ message }}
    </div>
  }

  <!-- Form Card -->
  <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
    
    <!-- Form Body -->
    <div class="p-8">
      
      <!-- Section 1: Company Info -->
      <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b border-gray-100 pb-2">Company Information</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 mb-8">
        <div class="md:col-span-2">
          <label class="flex items-center text-sm font-semibold text-gray-700 mb-2">
            <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
            Company Name <span class="text-red-500 ml-1">*</span>
          </label>
          <input type="text" [(ngModel)]="supplier.company_name" placeholder="e.g. UltraTech Cement" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50/50 focus:bg-white text-gray-800 placeholder-gray-400">
        </div>

        <div>
          <label class="flex items-center text-sm font-semibold text-gray-700 mb-2">
            <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            GSTIN (Tax ID)
          </label>
          <input type="text" [(ngModel)]="supplier.gstin" placeholder="e.g. 22AAAAA0000A1Z5" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50/50 focus:bg-white text-gray-800 placeholder-gray-400 uppercase">
        </div>

        <div>
          <label class="flex items-center text-sm font-semibold text-gray-700 mb-2">
            <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            Contact Person
          </label>
          <input type="text" [(ngModel)]="supplier.contact_person" placeholder="e.g. Rajesh Sharma" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50/50 focus:bg-white text-gray-800 placeholder-gray-400">
        </div>
      </div>

      <!-- Section 2: Contact Details -->
      <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b border-gray-100 pb-2">Contact Details</h3>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-5 mb-8">
        <div>
          <label class="flex items-center text-sm font-semibold text-gray-700 mb-2">
            <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
            Mobile Number <span class="text-red-500 ml-1">*</span>
          </label>
          <input type="text" [(ngModel)]="supplier.mobile" placeholder="e.g. 9876543210" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50/50 focus:bg-white text-gray-800 placeholder-gray-400">
        </div>
        
        <div>
          <label class="flex items-center text-sm font-semibold text-gray-700 mb-2">
            <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            Email Address
          </label>
          <input type="email" [(ngModel)]="supplier.email" placeholder="e.g. sales@ultratech.com" 
                 class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50/50 focus:bg-white text-gray-800 placeholder-gray-400">
        </div>
      </div>

      <!-- Section 3: Financials & Address -->
      <h3 class="text-lg font-semibold text-gray-800 mb-4 border-b border-gray-100 pb-2">Financials & Address</h3>
      
      <div class="grid grid-cols-1 gap-5">
        <div>
          <label class="flex items-center text-sm font-semibold text-gray-700 mb-2">
            <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            Opening Payable Balance (₹)
          </label>
          <input type="number" [(ngModel)]="supplier.outstanding_balance" placeholder="0" 
                 class="w-full md:w-1/2 border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50/50 focus:bg-white text-gray-800 placeholder-gray-400">
          <p class="text-xs text-gray-500 mt-1">Enter the amount you currently owe this supplier.</p>
        </div>

        <div>
          <label class="flex items-center text-sm font-semibold text-gray-700 mb-2">
            <svg class="w-4 h-4 mr-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            Full Address
          </label>
          <textarea [(ngModel)]="supplier.address" placeholder="Enter full office/warehouse address..." rows="3"
                    class="w-full border border-gray-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-gray-50/50 focus:bg-white text-gray-800 placeholder-gray-400 resize-none"></textarea>
        </div>
      </div>

    </div>

    <!-- Action Buttons Footer -->
    <div class="px-8 py-5 bg-gray-50 border-t border-gray-200 flex justify-end gap-3">
      <button (click)="cancel()" class="px-6 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 font-medium transition-all shadow-sm">
        Cancel
      </button>
      <button (click)="saveSupplier()" [disabled]="isSaving"
              class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2.5 rounded-xl shadow-lg shadow-blue-500/30 font-medium transition-all hover:-translate-y-0.5 disabled:opacity-50 disabled:hover:translate-y-0 flex items-center">
        @if (isSaving) {
          <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          Saving...
        } @else {
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
          Save Supplier
        }
      </button>
    </div>
  </div>
</div>
