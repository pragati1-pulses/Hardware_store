<header class="h-20 bg-white border-b border-gray-200 flex items-center justify-between px-8 sticky top-0 z-40 w-full shadow-sm print:hidden">
    
    <!-- Left Side: Breadcrumb -->
    <div class="flex items-center text-sm font-medium">
        <span class="text-gray-400">Buildmart</span>
        <svg class="w-4 h-4 mx-2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        <span class="text-gray-800 bg-gray-100 px-3 py-1 rounded-md">Workspace</span>
    </div>

    <!-- Right Side: Date, Notifications, Profile, Logout -->
    <div class="flex items-center space-x-4">
        
        <!-- Date -->
        <div class="text-sm font-medium text-gray-500 flex items-center mr-2">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            {{ today | date:'EEEE, d MMM' }}
        </div>

        <!-- Notification Bell -->
        <button class="relative p-2 text-gray-400 hover:text-gray-600 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
        </button>

        <!-- User Avatar (Shows first letter of name) -->
        <div class="flex items-center gap-2 cursor-pointer border-l border-gray-200 pl-4 ml-2">
            <div class="h-10 w-10 rounded-full bg-yellow-500 flex items-center justify-center text-white font-bold shadow-sm">
                {{ userName ? userName.charAt(0).toUpperCase() : 'A' }}
            </div>
            <div class="hidden md:block text-sm">
                <p class="font-medium text-gray-800">{{ userName || 'User' }}</p>
            </div>
        </div>

        <!-- 🚀 LOGOUT BUTTON 🚀 -->
        <button (click)="logout()" class="p-2.5 text-red-500 hover:bg-red-50 rounded-lg transition-colors" title="Logout">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
        </button>

    </div>
</header>
