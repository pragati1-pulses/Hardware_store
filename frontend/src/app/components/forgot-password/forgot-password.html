<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200 p-4">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden p-8 sm:p-10 m-4 border border-slate-100 relative">
    
    <!-- Decorative background glow -->
    <div class="absolute -top-20 -right-20 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <!-- Icon Badge -->
    <div class="flex justify-center mb-6">
      <div class="w-16 h-16 rounded-2xl bg-slate-900 flex items-center justify-center text-amber-400 shadow-lg shadow-slate-900/10">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
      </div>
    </div>

    <div class="text-center mb-8">
      <h2 class="text-2xl font-extrabold text-slate-900 tracking-tight">Forgot Password?</h2>
      <p class="text-slate-500 text-sm mt-1.5 leading-relaxed">Enter your email and we'll send you an OTP to recover your account.</p>
    </div>

    @if (message) {
      <div class="px-4 py-3.5 rounded-2xl mb-6 text-sm border flex items-center gap-3 shadow-sm"
           [ngClass]="isError ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-slate-900 border-slate-800 text-amber-400'">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span class="font-medium">{{ message }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Email Address</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/></svg>
          </span>
          <input type="email" [(ngModel)]="email" name="email" required placeholder="sir@buildmart.com"
                 class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 text-sm focus:bg-white focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
        </div>
      </div>

      <button type="submit" [disabled]="isLoading"
              class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-slate-900/10 hover:shadow-slate-900/20 active:scale-[0.99] transition-all disabled:opacity-50 flex items-center justify-center gap-2">
        @if (isLoading) {
          <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <span>Generating OTP...</span>
        } @else {
          <span>Send OTP</span>
        }
      </button>
    </form>

    <div class="text-center mt-6">
      <a routerLink="/login" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition-colors inline-flex items-center gap-1.5">
        ← Back to Login
      </a>
    </div>
  </div>
</div>
